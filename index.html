<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Ctrl+Heart</title><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="start.css">
<link rel="stylesheet" href="keyboard.css">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="stats.css">
</head><body>
<section id="start">
    <div class="sticky warn">warning: your spacebar has trust issues</div>

  <img id="start-icon" src="icon.svg" alt="Ctrl+Heart icon">
  <h1>Ctrl<span class="plus">+</span>Heart</h1>
  <p class="tagline">screen time for your keyboard</p>

  <div id="load-bar"><div id="load-fill"></div></div>
  <p id="load-text">loading feelings… 0%</p>

 <button id="start-btn" class="btn">START TYPING →</button>

  <details id="what">
    <summary class="btn ghost">wait, what?</summary>
    <p class="sticky">it's screen time for your keyboard. the keys have feelings. that's it.</p>
  </details>

  <svg class="doodle d1" viewBox="0 0 40 40"><path d="M20 2l5 13 14 1-11 9 4 14-12-8-12 8 4-14L1 16l14-1z" fill="#FFE27A" stroke="#2B0F1E" stroke-width="2.5" stroke-linejoin="round"/></svg>
  <svg class="doodle d2" viewBox="0 0 40 40"><path d="M20 2l5 13 14 1-11 9 4 14-12-8-12 8 4-14L1 16l14-1z" fill="#FF8FBD" stroke="#2B0F1E" stroke-width="2.5" stroke-linejoin="round"/></svg>
  <svg class="doodle d3" viewBox="0 0 80 20"><path d="M2 10q10-14 19 0t19 0 19 0 19 0" fill="none" stroke="#FF3D8B" stroke-width="4" stroke-linecap="round"/></svg>
</section>
<section id="dashboard" hidden>
    <aside id="controls">
  <button class="btn" id="btn-start">▶ START</button>
  <button class="btn" id="btn-pause">⏸ PAUSE</button>
  <button class="btn" id="btn-reset">↻ RESET</button>
</aside>
<header><h1>Ctrl+Heart</h1>
<span id="count"></span><span id="morale"></span></header>
<div id="keyboard"></div>
<div class="cards">
    
<div class="card"><h3>LIVE DRAMA</h3><ul id="drama"></ul>
</div>
<div class="card"><h3>#keyboard-gc</h3><div id="gc"></div>
</div>
<div class="card" id="fav"><h3>FAVOURITE CHILD</h3></div>
</div>
</section>
<script src="dialogue.js"></script>  <script src="keyboard.js">
</script>
<script src="feelings.js"></script>  <script src="chat.js">
</script>
<script src="stats.js"></script>     
<script src="start.js">
</script>
<script src="controls.js"></script>
</body></html>
